name: Publish checkout

on:
  workflow_dispatch:
    inputs:
      version:
        description: "OCI tag (empty → .asd :version)"
        required: false
        default: ""
        type: string
      packager_version:
        description: "Packager image version"
        required: false
        default: "0.16.0"
        type: string

jobs:
  publish-blackboard:
    uses: egao1980/cl-repository/.github/workflows/publish-source.yml@main
    with:
      system: blackboard-protocol
      version: ${{ inputs.version }}
      packager-version: ${{ inputs.packager_version }}
    permissions:
      contents: read
      packages: write

  # Colocated; canned publish.lisp forces provides=(system). Second package
  # so cl-repo:load-system "capability-protocol" resolves.
  publish-capability:
    needs: publish-blackboard
    uses: egao1980/cl-repository/.github/workflows/publish-source.yml@main
    with:
      system: capability-protocol
      version: ${{ inputs.version }}
      packager-version: ${{ inputs.packager_version }}
    permissions:
      contents: read
      packages: write
